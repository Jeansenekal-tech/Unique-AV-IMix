name: Build Windows recorder

on:
  push:
    branches: [main, master, 'claude/**']
    paths: ['windows-recorder/**', '.github/workflows/build-windows-recorder.yml']
    tags: ['recorder-v*']
  pull_request:
    paths: ['windows-recorder/**', '.github/workflows/build-windows-recorder.yml']
  # Actions → Build Windows recorder → Run workflow → type a version (e.g.
  # 1.0.1) to build and publish a GitHub Release with the .exe files.
  # Leave the version empty for a test build.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.1 (empty = test build, no release)'
        required: false
        default: ''

permissions:
  contents: read

env:
  # "1.2.3" from a pushed recorder-v1.2.3 tag, or the version typed into Run workflow
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/recorder-v') && github.ref_name || inputs.version }}

defaults:
  run:
    working-directory: windows-recorder

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm i --no-save playwright
      - run: npm test
      - run: xvfb-run -a node test/electron-smoke.mjs

  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Use the release version as the app version
        if: env.RELEASE_VERSION != ''
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${RELEASE_VERSION#recorder-v}"
      - name: Build installer + portable .exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never
      - name: Check the bundled FFmpeg
        shell: bash
        run: |
          ls -la dist
          test -f "dist/win-unpacked/resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Unique-AV-Recorder-windows
          path: |
            windows-recorder/dist/*.exe
          if-no-files-found: error

  # Publish a GitHub Release: push a tag (git tag recorder-v1.0.1 && git push
  # --tags) or use Run workflow with a version.
  release:
    if: startsWith(github.ref, 'refs/tags/recorder-v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - id: meta
        run: |
          V="${RELEASE_VERSION#recorder-v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: recorder-v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Unique AV Recorder ${{ steps.meta.outputs.version }} (Windows)
          body: |
            Basic Windows recorder for capture cards and USB audio.
            Download **Unique-AV-Recorder-Setup** to install, or **Unique-AV-Recorder-Portable** to run without installing.
            The app isn't code-signed: if Windows SmartScreen warns, click More info → Run anyway.
          files: dist/*.exe
          # The macOS app auto-updates from the repo's "latest" release, so
          # recorder releases must never take that spot.
          make_latest: false
